name: Publish NuGet

on:
  push:
    tags:
      - '*'

permissions:
  contents: write # create the GitHub release
  id-token: write # fetch the OIDC token exchanged for a short-lived NuGet API key

jobs:
  publish-nuget:

    name: publish-nuget
    runs-on: ${{ matrix.os }}
    # Must match the environment in the nuget.org Trusted Publishing policy
    environment: publish
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - name: "Checkout"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        lfs: true
        fetch-depth: 0
        
    - name: "Install .NET SDK"
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: "./global.json"

    - name: "Restore .NET tools"
      run: dotnet tool restore

    - name: "Update release notes"
      shell: pwsh
      run: |
        ./build.ps1

    - name: Create Packages
      run:  dotnet pack /p:PackageVersion=${{ github.ref_name }} -c Release -o ./output

    - name: NuGet login (OIDC)
      # Exchanges the workflow's OIDC token for a short-lived NuGet API key under the
      # Trusted Publishing policy on nuget.org. NUGET_USER is the nuget.org username of
      # the package owner. See https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push Packages
      run: dotnet nuget push "output/*.nupkg" -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate

    - name: "Extract latest release notes"
      shell: pwsh
      run: |
        $content = Get-Content RELEASE_NOTES.md -Raw
        # Match from the first #### heading to just before the second one
        if ($content -match '(?s)(####.+?)(?=\n####|\z)') {
          $Matches[1].Trim() | Set-Content RELEASE_NOTES_LATEST.md
        } else {
          $content | Set-Content RELEASE_NOTES_LATEST.md
        }

    - name: release
      uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1
      id: create_release
      with:
        draft: false
        prerelease: false
        release_name: 'Akka.Durable ${{ github.ref_name }}'
        tag_name: ${{ github.ref }}
        body_path: RELEASE_NOTES_LATEST.md
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Upload Release Asset
      uses: AButler/upload-release-assets@34491005a5d7ec239a784e460807ce844fde7962 # v4.0.0
      with:
          repo-token: ${{ github.token }}
          release-tag: ${{ github.ref_name }}
          files: 'output/*.nupkg'
